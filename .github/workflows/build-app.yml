name: Build and Lint Vite Application 🚀

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Run Prettier 🎨
        run: yarn format

      - name: Run Linter 🧹
        run: yarn lint

      - name: Run build 🏗️
        run: yarn build
